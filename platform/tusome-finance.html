<title>TUSOME Finance & Procurement</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: ledger app. Fixed left rail on desktop, top tab strip on phones; documents open in a side sheet. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --sunk:#EDEFF6; --ink:#16152B; --muted:#5C5F77; --line:#DCDFEA;
  --brand:#6A3BE0; --brand-soft:#EFE9FF; --sky:#1C8FE0;
  --ok:#17804F; --ok-bg:#E2F4EA; --warn:#8F5A00; --warn-bg:#FFF1D1; --bad:#B0233A; --bad-bg:#FCE4E8; --info-bg:#E6F2FD;
  --font:Manrope,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D1A; --surface:#17162B; --sunk:#201F3A; --ink:#ECEAF8; --muted:#A3A1BC; --line:#2F2D4E;
  --brand:#B193FF; --brand-soft:#2A2350; --sky:#5BB8FF;
  --ok:#5CD69D; --ok-bg:#11301F; --warn:#F1C063; --warn-bg:#33270C; --bad:#FF8C9B; --bad-bg:#3A1621; --info-bg:#10283A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D1A; --surface:#17162B; --sunk:#201F3A; --ink:#ECEAF8; --muted:#A3A1BC; --line:#2F2D4E;
  --brand:#B193FF; --brand-soft:#2A2350; --sky:#5BB8FF;
  --ok:#5CD69D; --ok-bg:#11301F; --warn:#F1C063; --warn-bg:#33270C; --bad:#FF8C9B; --bad-bg:#3A1621; --info-bg:#10283A; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:800;line-height:1.2}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.count{min-width:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;line-height:20px;text-align:center;font-weight:700}
.count.bad{background:var(--bad)}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12.5px;color:var(--muted)}
.who b{display:block;color:var(--ink);font-size:13.5px}
main{min-width:0;padding-block:24px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0;max-width:72ch}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--ink)}
.banner b{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:14px 16px}
.tile .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.tabs button{border:0;background:none;padding:11px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs .n{color:var(--muted);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--sky)}.p-mute{background:var(--sunk);color:var(--muted)}.p-brand{background:var(--brand-soft);color:var(--brand)}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.06);background:var(--brand)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--sunk)}
.li .t{font-weight:700}
/* side sheet */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-18px 0 50px rgba(10,8,30,.18);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.scrim{position:fixed;inset:0;background:rgba(10,8,30,.35);z-index:35}
.sh-head{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh-head .x{margin-left:auto;border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.sh-body{overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px}
.sec h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere;min-width:0}
/* approval chain */
.chain{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.rej .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.step.now .dot{border-color:var(--brand);color:var(--brand)}
.step .st{font-weight:700}
.trail{display:flex;gap:4px;margin-top:6px}
.trail span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.trail span.done{background:var(--ok)}.trail span.gap{background:var(--bad)}.trail span.now{background:var(--brand)}
/* forms */
dialog{border:0;padding:0;border-radius:14px;width:min(640px,94vw);max-height:90vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,8,30,.35)}
dialog::backdrop{background:rgba(10,8,30,.45)}
.dh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:17px}
.dh .x{margin-left:auto;border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted)}
.db{padding:16px 20px;display:grid;gap:12px;overflow-y:auto;max-height:calc(90vh - 130px)}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.f{display:grid;gap:4px;font-size:13px;font-weight:600;min-width:0}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:500;width:100%;min-width:0}
.f .hint{font-weight:500;color:var(--muted);font-size:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rule{background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:13px}
.rule b{display:block}
.picker{position:relative}
.menu{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(10,8,30,.15);max-height:240px;overflow:auto}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer}
.menu button:hover{background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.mobnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mobnav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .mobnav a{padding:12px 10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
  .mobnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.fg{grid-template-columns:1fr}
  dl{grid-template-columns:1fr} dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <aside class="rail" aria-label="Main">
    <div class="brand"><div class="mark" aria-hidden="true">T</div><div>TUSOME Finance<small>Procurement & approvals</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who">Connecting…</div>
  </aside>
  <div style="min-width:0">
    <nav class="mobnav" id="mobnav" aria-label="Main"></nav>
    <main><div class="wrap" id="view"></div></main>
  </div>
</div>
<div id="sheetRoot"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ constants ============ */
const DOMAIN = "tusome.ac.tz";
const CATS = ["Operations & Essential Costs","Training","M&E, Reporting, and Legal Support","Product Development & Tech Improvements","Marketing & User Acquisition","Safeguarding, Gender, & Compliance"];
const KINDS = ["Goods","Service","Consultant / individual contractor","Software / subscription","Event, travel or logistics"];
const FISCAL = ["Not checked","Verified","Exception approved","None"];
const EVIDENCE = ["Complete","Partially Supported","Missing Evidence","Amount Mismatch","Date Mismatch","Duplicate","Requires Clarification","Not Applicable"];
const SUP_TYPES = ["Company","Individual","Government body","Platform / online service","To confirm"];
const CON_TYPES = ["Supply of goods","Service","Consultancy","Software / subscription","Lease / rent","Other"];
const CON_STATUS = ["Draft","Active","Completed","Expired","Terminated"];
const ACC_TYPES = ["Bank account","Mobile-money wallet","Payment gateway","Petty cash","Card"];
const ACC_STATUS = ["Active","Dormant","Closed","To confirm","Personal account used for company payments"];
const ROLE_LABEL = {ID:"Band 1–2 approver (Independent Director)", DIR:"Director (Band 3, above USD threshold)", CUS:"Finance custodian"};
const ROLE_SHORT = {ID:"Independent Director", DIR:"Director", CUS:"Finance custodian"};
const VIEWS = [["today","Today"],["requests","Purchase requests"],["suppliers","Suppliers"],["contracts","Contracts"],["exceptions","Exceptions"],["accounts","Bank & wallets"],["audit","Audit trail"],["setup","Rules & roles"]];

/* ============ state ============ */
const S = {db:null,user:null,me:{id:null,name:"",email:null,canEdit:false,isOwner:false},canWrite:false,domainOk:true,
  settings:null,emails:{},requests:{},suppliers:{},contracts:{},accounts:{},approvals:{},audit:{},names:{},
  loaded:{settings:false,requests:false},stale:false,offline:false};
let view="today", tab="all", q="", sheetFor=null, dirtyNames=false;
const subs={appr:{},aud:{}};

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(k==="class")el.className=v;else if(k==="html")el.innerHTML=v;else el.setAttribute(k,v===true?"":v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)))}return el}
const today=()=>new Date().toISOString().slice(0,10);
const nowIso=()=>new Date().toISOString();
const n0=v=>Number(v)||0;
function money(a,c){if(a===""||a==null||isNaN(a))return "—";return (c==="USD"?"USD ":"TZS ")+Number(a).toLocaleString("en-GB",{minimumFractionDigits:c==="USD"?2:0,maximumFractionDigits:c==="USD"?2:0})}
const tzs=a=>money(a,"TZS");
function fmtDate(d){if(!d)return "—";const x=new Date(d.length===10?d+"T00:00:00":d);return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function fmtTime(d){const x=new Date(d);return isNaN(x)?"":x.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function pill(text,cls){return h("span",{class:"pill "+cls},text)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600)}
function nameOf(id){if(!id)return "—";const n=S.names[id];if(n===undefined){dirtyNames=true;return "…"}return n||"Someone"}
async function resolveNames(){if(!S.user||!dirtyNames)return;dirtyNames=false;const ids=new Set();
  Object.values(S.requests).forEach(r=>{r.requester&&ids.add(r.requester);r.payment?.by&&ids.add(r.payment.by)});
  Object.values(S.approvals).forEach(a=>ids.add(a.by));Object.values(S.audit).forEach(a=>ids.add(a.by));
  const list=[...ids].filter(Boolean);if(!list.length)return;
  try{const ps=await S.user.profiles(list);let ch=false;for(const id of list){const nm=ps[id]?.name||"";const em=ps[id]?.email||null;if(S.names[id]!==nm){S.names[id]=nm;ch=true}if(S.emails[id]!==em){S.emails[id]=em;ch=true}}if(ch)render()}catch(e){}}

/* ============ policy engine ============ */
function cfg(){return S.settings||{fxRates:[],band1Tzs:500000,thresholdUsd:1000,splitDays:30,policyDate:"2026-11-04",contractWarnDays:30,roles:{},wht:[]}}
function fxFor(d){const rates=(cfg().fxRates||[]).filter(r=>r.date&&n0(r.rate)>0).sort((a,b)=>a.date<b.date?-1:1);let pick=null;for(const r of rates){if(r.date<=d)pick=r}return pick||rates[rates.length-1]||null}
function amounts(r){const d=r.fxDate||r.date||today();const fx=fxFor(d);const rate=fx?n0(fx.rate):0;const a=n0(r.amount);
  if(r.currency==="USD")return{tzs:rate?a*rate:null,usd:a,rate,fx};return{tzs:a,usd:rate?a/rate:null,rate,fx}}
function bandOf(tzsV,usdV){const c=cfg();if(usdV!=null&&usdV>n0(c.thresholdUsd))return 3;if(tzsV!=null&&tzsV>=n0(c.band1Tzs))return 2;return 1}
function band(r){const a=amounts(r);return bandOf(a.tzs,a.usd)}
function bandText(n){const c=cfg();return n===1?"Below TZS "+n0(c.band1Tzs).toLocaleString("en-GB"):n===2?"TZS "+n0(c.band1Tzs).toLocaleString("en-GB")+" to USD "+n0(c.thresholdUsd).toLocaleString("en-GB"):"Above USD "+n0(c.thresholdUsd).toLocaleString("en-GB")}
function stepsFor(r){return band(r)===3?["ID","DIR"]:["ID"]}
function prePolicy(r){return (r.date||"")<(cfg().policyDate||"")}
function quotesState(r){if(prePolicy(r))return"Pre-policy";const need=band(r);return ((r.quotes||[]).length>=need||!!r.waiver)?"OK":"Short"}
function apprKey(reqId,rev,role){return reqId+"__"+rev+"__"+role}
function roleList(role){const v=(cfg().roleEmails||{})[role];return (Array.isArray(v)?v:[]).map(x=>String(x).toLowerCase())}
function roleHist(role){const v=(cfg().roleEmailHistory||{})[role];return (Array.isArray(v)?v:[]).map(x=>String(x).toLowerCase())}
function emailOf(uid){if(!uid)return null;if(uid===S.me.id&&S.me.email)return S.me.email.toLowerCase();const e=S.emails[uid];return e?e.toLowerCase():null}
function hasRole(role,uid){const e=emailOf(uid);return !!e&&roleList(role).includes(e)}
function validApprover(role,uid,d){let e=emailOf(uid);if(!e&&d&&d.email&&S.names[uid]!==undefined&&S.emails[uid]===null)e=String(d.email).toLowerCase();return !!e&&(roleList(role).includes(e)||roleHist(role).includes(e))}
function decisionFor(r,role){const d=S.approvals[apprKey(r.id,r.rev||1,role)];return d&&d.by!==r.requester&&validApprover(role,d.by,d)?d:null}
function chainState(r){const st=stepsFor(r);let out=[];let blocked=false;
  for(const role of st){const d=decisionFor(r,role);let s="pending";if(d)s=d.decision==="Approved"?"done":"rej";else if(!blocked&&r.submitted)s="now";if(s!=="done")blocked=true;out.push({role,dec:d,s})}
  return out}
function approvedAll(r){return chainState(r).every(x=>x.s==="done")}
function rejected(r){return chainState(r).some(x=>x.s==="rej")}
function status(r){
  if(!r.submitted)return{k:"draft",t:"Draft",c:"p-mute"};
  if(rejected(r))return{k:"rejected",t:"Rejected",c:"p-bad"};
  if(!approvedAll(r)){if(r.payment)return{k:"paid",t:"Paid without approval",c:"p-bad"};return{k:"approval",t:"Awaiting approval",c:"p-warn"}}
  if(!r.delivery)return{k:"approved",t:"Approved · awaiting delivery",c:"p-info"};
  if(!r.invoice)return{k:"approved",t:"Delivered · awaiting invoice",c:"p-info"};
  if(!r.payment)return{k:"payment",t:"Awaiting payment",c:"p-brand"};
  return{k:"paid",t:"Paid",c:"p-ok"}}
function supplierVerified(s){return !!(s&&s.tin&&["Yes","No"].includes(s.efd)&&s.callback==="Yes"&&s.verifiedBy&&["None declared","Declared"].includes(s.coi)&&s.f07)}
function supplierTotalInWindow(r){if(!r.supplierId||!r.date)return null;const w=n0(cfg().splitDays)*864e5;const d0=new Date(r.date);let t=0;

  [saveBtn("Save",async()=>{const p={band1Tzs:n0(val("r-b1")),thresholdUsd:n0(val("r-th")),splitDays:n0(val("r-sw")),policyDate:val("r-pd"),contractWarnDays:n0(val("r-cw"))};await saveSettings(p,"Thresholds changed","Band 2 from "+tzs(p.band1Tzs)+"; Director above USD "+p.thresholdUsd+"; split window "+p.splitDays+" days")})])}

function editRoles(){const body=h("div",{class:"fg"},h("p",{class:"small muted",style:"grid-column:1/-1;margin:0"},"Enter TUSOME email addresses, separated by commas. Anyone listed can act in that role. Each person signs in to claude.ai with that address and needs Contributor access (the Director: Editor)."),
  field("ro-DIR",ROLE_LABEL.DIR,"text",roleList("DIR").join(", "),{full:true}),field("ro-ID",ROLE_LABEL.ID,"text",roleList("ID").join(", "),{full:true,hint:"Either person can approve. Nobody approves their own request."}),field("ro-CUS",ROLE_LABEL.CUS,"text",roleList("CUS").join(", "),{full:true}));
  openDlg("Assign roles",body,[saveBtn("Save roles",async()=>{const out={};for(const k of ["DIR","ID","CUS"]){const list=val("ro-"+k).split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);
      const bad=list.filter(e=>!new RegExp("^[^@\\s]+@"+DOMAIN.replace(/\./g,"\\.")+"$").test(e));if(bad.length){toast("Use @"+DOMAIN+" addresses only: "+bad.join(", "));return false}out[k]=[...new Set(list)]}
    if(!out.ID.length||!out.DIR.length){toast("Assign at least one Band 1–2 approver and one Director.");return false}
    const hist=JSON.parse(JSON.stringify(cfg().roleEmailHistory||{}));for(const k of ["DIR","ID","CUS"]){roleList(k).forEach(e=>{if(!out[k].includes(e)){hist[k]=hist[k]||[];if(!hist[k].includes(e))hist[k].push(e)}})}
    await saveSettings({roleEmails:out,roleEmailHistory:hist},"Roles assigned","Director: "+out.DIR.join(", ")+"; Band 1–2: "+out.ID.join(", ")+"; Custodian: "+(out.CUS.join(", ")||"none"))})])}

/* ============ boot ============ */
render();
(async()=>{
  try{S.user=await window.claude?.use?.("user")}catch(e){S.user=null}
  if(S.user){try{const me=await S.user.me();S.me={id:me.id,name:me.name||"",email:me.email,canEdit:!!me.canEdit,isOwner:!!me.isOwner};const cw=await S.user.can("data.write");S.canWrite=cw!==false;
    S.domainOk=!me.email||me.email.toLowerCase().endsWith("@"+DOMAIN)||me.isOwner;if(me.id)S.names[me.id]=me.name||""}catch(e){}}
  try{S.db=await window.claude?.use?.("db")}catch(e){S.db=null}
  S._dbTried=true;if(!S.db){render();return}
  const timer=setTimeout(()=>{S.stale=true;render()},10000);const clear=()=>{clearTimeout(timer);if(S.stale){S.stale=false}};
  const onErr=e=>{console.warn(e);clear();render()};
  S.db.doc("config/settings").onSnapshot(sn=>{S.settings=sn.exists?sn.data():null;S.loaded.settings=true;if(!sn.metadata.fromCache)clear();render()},onErr);
  const coll=(name,key,flag)=>S.db.collection(name).onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]=Object.assign({id:d.id},d.data()));S[key]=m;if(flag)S.loaded[flag]=true;if(!sn.metadata.fromCache)clear();render()},onErr);
  coll("requests","requests","requests");coll("suppliers","suppliers");coll("contracts","contracts");coll("accounts","accounts");
  const fanout=(root,sub,store,bag,lim)=>S.db.collection(root).onSnapshot(sn=>{sn.docs.forEach(d=>{const uid=d.id;if(bag[uid])return;
    let q2=S.db.collection(root+"/"+uid+"/"+sub);if(lim)q2=q2.orderBy("at","desc").limit(lim);
    bag[uid]=q2.onSnapshot(s2=>{for(const k of Object.keys(S[store]))if(S[store][k]._u===uid)delete S[store][k];
      s2.docs.forEach(x=>{const v=Object.assign({_u:uid},x.data());if(store==="approvals"){if(v.by!==uid)return;S.approvals[apprKey(v.reqId,v.rev,v.role)]=v}else S.audit[uid+"/"+x.id]=Object.assign({by:uid},v,{by:uid})});render()},onErr)})},onErr);
  fanout("approvals","d","approvals",subs.appr,0);fanout("audit","e","audit",subs.aud,400);
  readHash();
})();
</script>
