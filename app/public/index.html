<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TUSOME Finance & Procurement</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: ledger app. Fixed left rail on desktop, top tab strip on phones; documents open in a side sheet. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --sunk:#EDEFF6; --ink:#16152B; --muted:#5C5F77; --line:#DCDFEA;
  --brand:#6A3BE0; --brand-soft:#EFE9FF; --sky:#1C8FE0;
  --ok:#17804F; --ok-bg:#E2F4EA; --warn:#8F5A00; --warn-bg:#FFF1D1; --bad:#B0233A; --bad-bg:#FCE4E8; --info-bg:#E6F2FD;
  --font:Manrope,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D1A; --surface:#17162B; --sunk:#201F3A; --ink:#ECEAF8; --muted:#A3A1BC; --line:#2F2D4E;
  --brand:#B193FF; --brand-soft:#2A2350; --sky:#5BB8FF;
  --ok:#5CD69D; --ok-bg:#11301F; --warn:#F1C063; --warn-bg:#33270C; --bad:#FF8C9B; --bad-bg:#3A1621; --info-bg:#10283A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D1A; --surface:#17162B; --sunk:#201F3A; --ink:#ECEAF8; --muted:#A3A1BC; --line:#2F2D4E;
  --brand:#B193FF; --brand-soft:#2A2350; --sky:#5BB8FF;
  --ok:#5CD69D; --ok-bg:#11301F; --warn:#F1C063; --warn-bg:#33270C; --bad:#FF8C9B; --bad-bg:#3A1621; --info-bg:#10283A; color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:800;line-height:1.2}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.count{min-width:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;line-height:20px;text-align:center;font-weight:700}
.count.bad{background:var(--bad)}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12.5px;color:var(--muted)}
.who b{display:block;color:var(--ink);font-size:13.5px}
main{min-width:0;padding-block:24px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0;max-width:72ch}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--ink)}
.banner b{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:14px 16px}
.tile .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding:0 8px}
.tabs button{border:0;background:none;padding:11px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs .n{color:var(--muted);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--sky)}.p-mute{background:var(--sunk);color:var(--muted)}.p-brand{background:var(--brand-soft);color:var(--brand)}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.06);background:var(--brand)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--sunk)}
.li .t{font-weight:700}
/* side sheet */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-18px 0 50px rgba(10,8,30,.18);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.scrim{position:fixed;inset:0;background:rgba(10,8,30,.35);z-index:35}
.sh-head{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh-head .x{margin-left:auto;border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.sh-body{overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px}
.sec h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere;min-width:0}
/* approval chain */
.chain{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.rej .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.step.now .dot{border-color:var(--brand);color:var(--brand)}
.step .st{font-weight:700}
.trail{display:flex;gap:4px;margin-top:6px}
.trail span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.trail span.done{background:var(--ok)}.trail span.gap{background:var(--bad)}.trail span.now{background:var(--brand)}
/* forms */
dialog{border:0;padding:0;border-radius:14px;width:min(640px,94vw);max-height:90vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,8,30,.35)}
dialog::backdrop{background:rgba(10,8,30,.45)}
.dh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:17px}
.dh .x{margin-left:auto;border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted)}
.db{padding:16px 20px;display:grid;gap:12px;overflow-y:auto;max-height:calc(90vh - 130px)}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.f{display:grid;gap:4px;font-size:13px;font-weight:600;min-width:0}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:500;width:100%;min-width:0}
.f .hint{font-weight:500;color:var(--muted);font-size:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rule{background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:13px}
.rule b{display:block}
.picker{position:relative}
.menu{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(10,8,30,.15);max-height:240px;overflow:auto}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer}
.menu button:hover{background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.mobnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mobnav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .mobnav a{padding:12px 10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
  .mobnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.fg{grid-template-columns:1fr}
  dl{grid-template-columns:1fr} dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.auth{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.authcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
.authcard h1{font-size:22px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;justify-self:start}

/* ---- phone layout ---- */
.tabbar{display:none}
.qrow{display:grid;grid-template-columns:1.2fr .8fr 1.2fr auto;gap:12px;align-items:end}
.envbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:6px}
.envbar i{display:block;height:100%;background:var(--brand)}
.envbar i.over{background:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.kv span:first-child{color:var(--muted)}
.menu-list{display:grid;gap:2px}
.menu-list a,.menu-list button{display:flex;justify-content:space-between;padding:13px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;font-size:15px}
@media (max-width:860px){
  .mobnav{display:none!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;position:relative}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--brand)}
  .tabbar .count{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;line-height:17px;font-size:10px;padding:0 4px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-weight:800}
  main{padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
  h1{font-size:21px}
  .head{align-items:stretch}
  .head>.row{width:100%}
  .head>.row .btn{flex:1;padding:11px 14px}
  .tiles{grid-template-columns:1fr 1fr}
  .tile:last-child:nth-child(odd){grid-column:1/-1}
  .tile{padding:12px}
  .tile .v{font-size:18px}
  .qrow{grid-template-columns:1fr 1fr}
  .qrow .f:nth-child(3){grid-column:1/-1}
  .f input,.f select,.f textarea,.toolbar input,.toolbar select{font-size:16px}
  .btn{padding:10px 14px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  dialog[open]{display:flex;flex-direction:column}
  .db{max-height:none;flex:1}
  .sheet{width:100vw}
  .sh-body .row .btn{flex:1}
  .toolbar input{flex:1;min-width:0}
}
@media (min-width:861px){.topbar{display:none}}
@media (max-width:700px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:14px;text-align:right;min-width:0}
  table.rt td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none}
  table.rt td.primary{display:block;text-align:left;font-size:15px;padding-bottom:4px}
  table.rt td.primary::before{content:none}
  table.rt td.num{white-space:normal}
}
</style>
</head>
<body>
<div id="authRoot"></div>
<div class="app" id="appRoot" hidden>
  <aside class="rail" aria-label="Main">
    <div class="brand"><div class="mark" aria-hidden="true">T</div><div>TUSOME Finance<small>Procurement & approvals</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <div style="min-width:0">
    <div class="topbar" id="topbar"><div class="mark" aria-hidden="true">T</div><span id="topTitle">TUSOME Finance</span></div>
    <nav class="mobnav" id="mobnav" aria-label="Main"></nav>
    <main><div class="wrap" id="view"></div></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
<div id="sheetRoot"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/app.js"></script>
</body>
</html>
